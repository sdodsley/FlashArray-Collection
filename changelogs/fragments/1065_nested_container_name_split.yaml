bugfixes:
  - purefa_pg - Fix a protection group in a pod that is itself in a realm, named
    C(realm::pod::pgroup), being treated as though the realm were the pod. Containers nest, so the
    pod is C(realm::pod), but the pod existence check looked for a pod named after the realm alone
    and failed with "Pod <realm> does not exist", and the naming convention check validated the pod
    name rather than the protection group name.
  - purefa_volume - Fix the same mishandling of a C(realm::pod::pgroup) value passed to the
    C(pgroup) option, where the naming convention check validated the pod name rather than the
    protection group name, and the pod existence failure named the realm alone.
  - purefa_pgsnap - Fix C(restore) from a protection group in a pod that is itself in a realm. The
    volume to restore was qualified with the realm alone, as C(realm::volume), rather than with the
    whole container, so it never matched a volume in the protection group.
