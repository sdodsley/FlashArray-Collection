minor_changes:
  - purefa_info - Report C(is_local) for each host in the C(hosts) subset. On an array in a
    synchronous replication relationship, C(get_hosts) also returns the peer array's hosts, named
    C(<peer array>:<host>). These were indistinguishable from local hosts in the returned dict, so
    a playbook looping over C(hosts) would pass a remote host name to a module such as
    C(purefa_host), which rejects it as not conforming to the host naming convention. Filter on
    C(is_local) to act only on hosts owned by the array being queried.
  - purefa_info - Report C(is_local) for each protection group in the C(pgroups) and
    C(deleted_pgroups) subsets, for the same reason.
  - purefa_info - Report C(is_local) for each fleet member in the C(fleet) subset, identifying
    which member is the array being queried.
bugfixes:
  - purefa_info - Fix destroyed volume snapshots always being reported with C(is_local) set to
    true in the C(deleted_snapshots) subset. A snapshot replicated from another array is now
    correctly reported as not local, matching the behaviour of the C(snapshots) subset.
