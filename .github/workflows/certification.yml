name: Run collection certification checks

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: cert-ver-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Files that are not related to the core functionality
# of your collection can cause Ansible Lint to fail.
# If this happens, add an .ansible-lint file that includes
# those files and directories to the root of your
# repository; for example:
# https://github.com/ansible-collections/partner-certification-checker/blob/main/.ansible-lint

# If there are sanity test failures that cannot be fixed and are allowed to ignore
# https://docs.ansible.com/projects/lint/rules/sanity/, create a sanity ignore file
# https://docs.ansible.com/projects/ansible/devel/dev_guide/testing/sanity/ignores.html#ignore-file-location
# for each affected version of ansible-core (for example, `tests/sanity/ignore-2.18.txt`) and add corresponding entries.
jobs:
  call:
    uses: ansible-collections/partner-certification-checker/.github/workflows/certification-reusable.yml@v4.0.0

  # The checker above runs against the source tree. Automation Hub runs against
  # the built artifact, which galaxy.yml build_ignore strips content from - so
  # the two see different collections. everpure.flasharray 1.45.0 was rejected
  # for exactly that gap: build_ignore removes tests/unit, but the sanity ignore
  # file that referenced those files was still shipped, and "ignores" errors on
  # an entry whose target does not exist. This job builds the collection the way
  # Automation Hub receives it and runs sanity on that.
  sanity-on-built-artifact:
    name: Sanity on built artifact (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version requires_ansible allows, which is what a reviewer
        # will use, and which selects tests/sanity/ignore-2.16.txt if present.
        ansible: ["2.16", "2.17", "2.18"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-core ${{ matrix.ansible }}
        run: pip install "ansible-core>=${{ matrix.ansible }},<${{ matrix.ansible }}.99"

      - name: Build the collection
        run: ansible-galaxy collection build --output-path /tmp/build

      - name: Extract the artifact into a collection tree
        run: |
          mkdir -p /tmp/tree/ansible_collections/everpure/flasharray
          tar xzf /tmp/build/*.tar.gz \
            -C /tmp/tree/ansible_collections/everpure/flasharray

      - name: Fail if a release archive or repo-only dotfile was shipped
        run: |
          cd /tmp/tree/ansible_collections/everpure/flasharray
          if ls *.tar.gz *.tgz *.zip .gitignore .git-blame-ignore-revs 2>/dev/null; then
            echo "::error::Non user-facing files were included in the build."
            echo "Add them to build_ignore in galaxy.yml."
            exit 1
          fi
          echo "No archives or repo-only dotfiles in the artifact."

      - name: Run sanity against the artifact
        run: |
          cd /tmp/tree/ansible_collections/everpure/flasharray
          ansible-test sanity --python 3.11
